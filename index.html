<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>유기견 타워 디펜스</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        @font-face {
            font-family: 'IncheonEducationHimchan';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-2@1.0/iceHimchan-Rg.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'JejuStoneWall';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-EF@1.0/EF_jejudoldam.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            /* 플렉스 박스 사용 */
            justify-content: center;
            /* 가로 중앙 정렬 */
            align-items: center;
            /* 세로 중앙 정렬 */
            min-height: 100vh;
            /* 화면 높이 100% 사용 */
            background-color: #2E2F3E;
            /* 아까 형이 말한 그 배경색! */
            overflow: hidden;
            /* 스크롤바 방지 */
        }

        canvas {
            display: block;
            /* 캔버스를 블록 요소로 취급 */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            /* 테두리에 그림자 살짝 (간지) */
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <script src="constant/const.js"></script>
    <script src="constant/preload.js"></script>

    <script src="constant/DesignConst.js"></script>

    <script src="constant/DogConst.js"></script>
    <script src="constant/ItemDescription.js"></script>
    <script src="component/AAtest.js"></script>
    <script src="component/Pet.js"></script>
    <script src="component/Sprite.js"></script>
    <script src="component/Effect.js"></script>
    <script src="component/GameReset.js"></script>
    <script src="component/DrawUI.js"></script>
    <script src="component/Sprite.js"></script>
    <script src="component/GameState_Play.js"></script>
    <script src="component/Introduction.js"></script>
    <script src="component/Dog.js"></script>
    <script src="component/Tower.js"></script>
    <script src="component/Bullet.js"></script>
    <script src="component/StageManager.js"></script>
    <script src="component/HexGridManager.js"></script>
    <script src="component/HexTile.js"></script>
    <script src="component/Shop.js"></script>
    <script src="component/StageInfo.js"></script>
    <script src="component/DrawGameover.js"></script>
    <script src="component/ApiInfo.js"></script>
    <script src="mainplay.js"></script>
</body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>

</html>
